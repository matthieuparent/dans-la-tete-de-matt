<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin matthieuparent@outlook.com
    ServerName matthieuparent.com
    ServerAlias www.matthieuparent.com

    # Pages statiques servies par Apache depuis la version en ligne (lien symbolique).
    DocumentRoot /srv/portfolio/app/dist/client
    <Directory /srv/portfolio/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.html
    DirectorySlash Off
    AddDefaultCharset UTF-8

    RewriteEngine on
    # www -> domaine principal
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://matthieuparent.com%{REQUEST_URI} [END,NE,R=permanent]
    # Pas de barre oblique finale (trailingSlash: never)
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^(.+)/$ $1 [END,NE,R=permanent]
    # /carnet -> carnet.html (build.format: file)
    RewriteCond %{REQUEST_URI} !^/api(/|$)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
    RewriteRule ^(.+)$ $1.html [END]

    # Seule l API dynamique passe par Node.
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api http://127.0.0.1:4321/api connectiontimeout=5 timeout=30
    ProxyPassReverse /api http://127.0.0.1:4321/api

    # Fichiers fingerprintés : cache long.
    <LocationMatch "^/_astro/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/matthieuparent-error.log
    CustomLog ${APACHE_LOG_DIR}/matthieuparent-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/matthieuparent.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/matthieuparent.com/privkey.pem
</VirtualHost>
</IfModule>
